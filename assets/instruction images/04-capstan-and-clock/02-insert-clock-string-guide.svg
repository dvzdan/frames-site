<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Insert the Clock String Guide</title>
  <desc id="desc">The clock remains flat in its established lower-left wall pocket. The revised blue clock string guide is aligned over the bare spindle and pressed inward toward the clock.</desc>
  <defs>
    <linearGradient id="guideBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f80fa"/>
      <stop offset="1" stop-color="#0754cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#263247" flood-opacity=".27"/>
    </filter>
    <marker id="pressHead" markerWidth="20" markerHeight="20" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12">
      <path d="M0 0L12 6L0 12Z" fill="#20242a"/>
    </marker>
  </defs>

  <!-- Authoritative old guide scene, cleaned while preserving the clock's exact position. -->
  <image href="02-insert-clock-string-guide-base-flat.png" x="0" y="0" width="1536" height="1024"/>

  <!-- Replace the obsolete top guide card with the revised captive guide. -->
  <g filter="url(#shadow)">
    <rect x="112" y="42" width="208" height="220" rx="13" fill="#fff"/>
    <g transform="translate(137 76) scale(.40)">
      <path fill="url(#guideBlue)" fill-rule="evenodd" d="M0 32Q0 18 14 18H390Q404 18 404 32V128Q404 142 390 142H14Q0 142 0 128ZM202 44a34 34 0 1 0 0 68a34 34 0 1 0 0-68Z"/>
      <path fill="#4389fa" stroke="#0754cf" stroke-width="6" fill-rule="evenodd" d="M150 142V78A52 52 0 0 1 254 78V142ZM202 44a34 34 0 1 0 0 68a34 34 0 1 0 0-68Z"/>
      <path fill="#2f80fa" stroke="#0754cf" stroke-width="6" d="M180 18V-12H224V18L218 39H186Z"/>
    </g>
    <text x="216" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#15171b">Clock String Guide</text>
  </g>

  <!-- Remove the obsolete Capstan card; the Clock Mechanism card remains untouched. -->
  <rect x="70" y="520" width="290" height="270" fill="#fff"/>

  <!-- Replace the obsolete capstan check with the seating check for this step. -->
  <g filter="url(#shadow)">
    <rect x="1065" y="42" width="375" height="270" rx="15" fill="#fff" stroke="#dedbd5" stroke-width="2"/>
    <text x="1093" y="91" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17191d">Check:</text>
    <text x="1093" y="133" font-family="Arial, sans-serif" font-size="23" fill="#24272c">
      <tspan x="1093" dy="0">The guide should sit squarely</tspan>
      <tspan x="1093" dy="36">and fully seated against the</tspan>
      <tspan x="1093" dy="36">clock mechanism, with the</tspan>
      <tspan x="1093" dy="36">spindle centered in the opening.</tspan>
    </text>
  </g>

  <!-- Revised guide, correctly proportioned and centered over the established spindle. -->
  <g transform="translate(420 568) scale(.55) rotate(-2 182 69)" filter="url(#shadow)">
    <path fill="url(#guideBlue)" fill-rule="evenodd" d="M0 24Q0 10 14 10H350Q364 10 364 24V116Q364 130 350 130H14Q0 130 0 116ZM182 37a32 32 0 1 0 0 64a32 32 0 1 0 0-64Z"/>
    <path fill="#4389fa" stroke="#0754cf" stroke-width="5" fill-rule="evenodd" d="M132 130V69A50 50 0 0 1 232 69V130ZM182 37a32 32 0 1 0 0 64a32 32 0 1 0 0-64Z"/>
    <path fill="#2f80fa" stroke="#0754cf" stroke-width="5" d="M161 10V-19H203V10L197 31H167Z"/>
    <path fill="#0648b8" opacity=".35" d="M0 106H132V130H14Q0 130 0 116ZM232 106H364V116Q364 130 350 130H232Z"/>
    <circle cx="182" cy="69" r="32" fill="none" stroke="#0754cf" stroke-width="5"/>
  </g>

  <!-- Short foreshortened press along the spindle projection: outward/lower-left to inward/upper-right. -->
  <path d="M505 622L542 597" fill="none" stroke="#20242a" stroke-width="6" stroke-linecap="round" marker-end="url(#pressHead)"/>

  <!-- Replace the old slide caption without changing the panel layout. -->
  <g filter="url(#shadow)">
    <rect x="170" y="823" width="1195" height="170" rx="17" fill="#fff" stroke="#dedbd5" stroke-width="2"/>
    <text x="768" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#15171b">
      <tspan>Position the </tspan><tspan fill="#1468e9" font-weight="700">Clock String Guide</tspan><tspan> over the spindle, then</tspan>
      <tspan x="768" dy="49" font-weight="700">press</tspan><tspan font-weight="400"> it straight onto the Clock Mechanism until fully seated.</tspan>
    </text>
  </g>
</svg>
