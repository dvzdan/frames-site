<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Press the Clock String Guide onto the Clock Mechanism</title>
  <desc id="desc">The revised blue clock string guide is aligned over the clock mechanism spindle and pressed straight toward the mechanism. No capstan is installed yet.</desc>
  <defs>
    <linearGradient id="guideBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d79f6"/>
      <stop offset="1" stop-color="#0755d3"/>
    </linearGradient>
    <linearGradient id="rigGray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78808a"/>
      <stop offset="1" stop-color="#444b55"/>
    </linearGradient>
    <linearGradient id="clockFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30343a"/>
      <stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1c2330" flood-opacity=".23"/>
    </filter>
    <marker id="arrowHead" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#22262c"/>
    </marker>
  </defs>

  <rect width="1800" height="1200" fill="#fff"/>

  <!-- Part cards -->
  <g filter="url(#softShadow)">
    <rect x="45" y="68" width="300" height="300" rx="12" fill="#fff" stroke="#dedbd5" stroke-width="2"/>
    <g transform="translate(88 112) scale(.28)">
      <path fill="url(#guideBlue)" d="M0 80Q0 50 30 50H570Q600 50 600 80V360Q600 390 570 390H30Q0 390 0 360Z"/>
      <path fill="#0649bb" opacity=".5" d="M0 340H600V365Q600 390 570 390H30Q0 390 0 360Z"/>
      <path fill="#4388f6" stroke="#0755d3" stroke-width="10" d="M195 390V245A105 105 0 0 1 405 245V390Z"/>
      <circle cx="300" cy="245" r="58" fill="#fff" stroke="#0755d3" stroke-width="9"/>
      <path fill="#2d79f6" stroke="#0755d3" stroke-width="9" d="M265 50V8H335V50L324 86H276Z"/>
    </g>
    <text x="195" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#17191d">Clock String Guide</text>

    <rect x="45" y="400" width="300" height="300" rx="12" fill="#fff" stroke="#dedbd5" stroke-width="2"/>
    <g transform="translate(110 440)">
      <rect x="0" y="0" width="170" height="170" rx="18" fill="url(#clockFace)" stroke="#08090b" stroke-width="6"/>
      <circle cx="20" cy="20" r="7" fill="#08090b"/><circle cx="150" cy="20" r="7" fill="#08090b"/>
      <circle cx="20" cy="150" r="7" fill="#08090b"/><circle cx="150" cy="150" r="7" fill="#08090b"/>
      <circle cx="85" cy="85" r="24" fill="#c9a54c" stroke="#8d6e24" stroke-width="5"/>
      <circle cx="85" cy="85" r="14" fill="#f1eee2" stroke="#a7a398" stroke-width="3"/>
      <circle cx="85" cy="85" r="5" fill="#8f9399"/>
    </g>
    <text x="195" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#17191d">Clock Mechanism</text>
  </g>

  <!-- Main assembly: an isolated three-quarter mechanism view keeps the Y-axis press unambiguous. -->
  <g>
    <path d="M455 260L1190 185L1370 315L635 390Z" fill="#a3a9b0" opacity=".34"/>
    <path d="M635 390L1370 315V805L635 885Z" fill="url(#rigGray)" opacity=".54"/>

    <!-- Clock body seated in the gray rig. -->
    <g filter="url(#softShadow)">
      <path d="M675 445L1120 402L1190 456V790L745 838L675 785Z" fill="url(#clockFace)" stroke="#101318" stroke-width="7"/>
      <path d="M1120 402L1190 456V790L1120 735Z" fill="#0b0d10" opacity=".75"/>
      <circle cx="718" cy="483" r="8" fill="#050607"/><circle cx="1103" cy="445" r="8" fill="#050607"/>
      <circle cx="718" cy="781" r="8" fill="#050607"/><circle cx="1103" cy="744" r="8" fill="#050607"/>
    </g>

    <!-- Spindle and its axis. -->
    <path d="M927 606L1055 500" stroke="#d9bd68" stroke-width="28" stroke-linecap="round"/>
    <path d="M927 606L1055 500" stroke="#f2efe4" stroke-width="14" stroke-linecap="round"/>
    <circle cx="927" cy="606" r="31" fill="#d5ad43" stroke="#9e7821" stroke-width="6"/>
    <circle cx="927" cy="606" r="17" fill="#f3f0e5" stroke="#a8a49a" stroke-width="4"/>
    <path d="M927 606L1065 492" stroke="#1f6be3" stroke-width="3" stroke-dasharray="10 11" opacity=".6"/>

    <!-- Ghosted seated position on the mechanism face. -->
    <g transform="translate(680 495) skewY(-6)" opacity=".18">
      <path fill="#0d63e7" d="M0 35Q0 15 20 15H485Q505 15 505 35V210Q505 230 485 230H20Q0 230 0 210Z"/>
      <path fill="#2d79f6" d="M170 230V135A82 82 0 0 1 334 135V230Z"/>
      <circle cx="252" cy="135" r="48" fill="#fff"/>
    </g>

    <!-- Active guide, aligned with the spindle but still forward along Y. -->
    <g transform="translate(813 278) rotate(-6 252 120)" filter="url(#softShadow)">
      <path fill="url(#guideBlue)" d="M0 35Q0 15 20 15H485Q505 15 505 35V210Q505 230 485 230H20Q0 230 0 210Z"/>
      <path fill="#0649bb" opacity=".48" d="M0 190H505V210Q505 230 485 230H20Q0 230 0 210Z"/>
      <path fill="#4388f6" stroke="#0755d3" stroke-width="7" d="M170 230V135A82 82 0 0 1 334 135V230Z"/>
      <circle cx="252" cy="135" r="48" fill="#fff" stroke="#0755d3" stroke-width="7"/>
      <path fill="#2d79f6" stroke="#0755d3" stroke-width="7" d="M225 15V-24H279V15L270 46H234Z"/>
    </g>

    <!-- Short axial press indicator; deliberately not a vertical slide arrow. -->
    <path d="M1090 525C1054 556 1019 584 976 620" fill="none" stroke="#22262c" stroke-width="15" stroke-linecap="round" marker-end="url(#arrowHead)"/>
    <path d="M1130 492L1110 516L1087 521" fill="none" stroke="#22262c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1162 468L1142 492L1119 497" fill="none" stroke="#22262c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1180" y="550" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#22262c" transform="rotate(-40 1180 550)">PRESS</text>

    <g font-family="Arial, sans-serif" font-weight="700" font-size="24" text-anchor="middle">
      <circle cx="1085" cy="325" r="24" fill="#fff" stroke="#5b6169" stroke-width="3"/><text x="1085" y="334" fill="#22262c">1</text>
      <circle cx="1005" cy="608" r="24" fill="#fff" stroke="#5b6169" stroke-width="3"/><text x="1005" y="617" fill="#22262c">2</text>
    </g>
  </g>

  <!-- Check card -->
  <g filter="url(#softShadow)">
    <rect x="1390" y="105" width="360" height="315" rx="18" fill="#fff" stroke="#dedbd5" stroke-width="2"/>
    <text x="1425" y="160" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17191d">Check:</text>
    <text x="1425" y="208" font-family="Arial, sans-serif" font-size="27" fill="#24272c">
      <tspan x="1425" dy="0">The guide should sit squarely</tspan>
      <tspan x="1425" dy="42">and fully seated against the</tspan>
      <tspan x="1425" dy="42">clock mechanism, with the</tspan>
      <tspan x="1425" dy="42">spindle centered in the opening.</tspan>
    </text>
  </g>

  <!-- Caption -->
  <g filter="url(#softShadow)">
    <rect x="190" y="980" width="1420" height="165" rx="18" fill="#fff" stroke="#dedbd5" stroke-width="2"/>
    <text x="900" y="1045" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" fill="#17191d">
      <tspan>Position the </tspan><tspan fill="#1468e9" font-weight="700">Clock String Guide</tspan><tspan> over the spindle, then</tspan>
      <tspan x="900" dy="54" font-weight="700">press</tspan><tspan font-weight="400"> it straight onto the Clock Mechanism until fully seated.</tspan>
    </text>
  </g>
</svg>
