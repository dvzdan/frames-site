<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Insert the Clock String Guide</title>
  <desc id="desc">A direct continuation of the clock-installation panel. The installed clock remains in the same frame position while the revised blue clock string guide is aligned over its spindle and pressed toward the clock.</desc>
  <defs>
    <linearGradient id="guideBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d7cf8"/>
      <stop offset="1" stop-color="#0754cf"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#352f2a" flood-opacity=".24"/>
    </filter>
    <filter id="partShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#1b2941" flood-opacity=".30"/>
    </filter>
    <marker id="pressHead" markerWidth="28" markerHeight="28" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12">
      <path d="M0 0L12 6L0 12Z" fill="#20242a"/>
    </marker>
  </defs>

  <!-- Clean continuation of the immediately preceding clock-installation panel. -->
  <image href="02-insert-clock-string-guide-base.png" x="0" y="0" width="1536" height="1024"/>

  <!-- Replace only the second part card: Frame becomes Clock String Guide. -->
  <g filter="url(#cardShadow)">
    <rect x="57" y="420" width="266" height="307" rx="18" fill="#fff"/>
    <g transform="translate(92 452) scale(.34)">
      <path fill="url(#guideBlue)" fill-rule="evenodd" d="M0 55Q0 30 25 30H385Q410 30 410 55V240Q410 265 385 265H25Q0 265 0 240ZM205 89a42 42 0 1 0 0 84a42 42 0 1 0 0-84Z"/>
      <path fill="#4389fa" stroke="#0754cf" stroke-width="7" fill-rule="evenodd" d="M140 265V132A65 65 0 0 1 270 132V265ZM205 89a42 42 0 1 0 0 84a42 42 0 1 0 0-84Z"/>
      <path fill="#2d7cf8" stroke="#0754cf" stroke-width="7" d="M180 30V-7H230V30L222 57H188Z"/>
      <path fill="#0647b4" opacity=".42" d="M0 232H140V265H25Q0 265 0 240ZM270 232H410V240Q410 265 385 265H270Z"/>
    </g>
    <text x="190" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" fill="#111317">Clock String Guide</text>
  </g>

  <!-- Active guide: same scene and clock position, offset only along the spindle axis. -->
  <g transform="translate(460 360) rotate(-4 210 110)" filter="url(#partShadow)">
    <path fill="url(#guideBlue)" fill-rule="evenodd" d="M0 45Q0 22 23 22H397Q420 22 420 45V190Q420 213 397 213H23Q0 213 0 190ZM210 72a38 38 0 1 0 0 76a38 38 0 1 0 0-76Z"/>
    <path fill="#4389fa" stroke="#0754cf" stroke-width="6" fill-rule="evenodd" d="M145 213V110A65 65 0 0 1 275 110V213ZM210 72a38 38 0 1 0 0 76a38 38 0 1 0 0-76Z"/>
    <path fill="#2d7cf8" stroke="#0754cf" stroke-width="6" d="M184 22V-17H236V22L228 51H192Z"/>
    <path fill="#0647b4" opacity=".42" d="M0 181H145V213H23Q0 213 0 190ZM275 181H420V190Q420 213 397 213H275Z"/>
    <circle cx="210" cy="110" r="38" fill="none" stroke="#0754cf" stroke-width="6"/>
  </g>

  <!-- Short, foreshortened press along the spindle's visible Y-axis projection. -->
  <path d="M650 495L706 454" fill="none" stroke="#20242a" stroke-width="9" stroke-linecap="round" marker-end="url(#pressHead)"/>
  <path d="M629 507L641 490L624 492" fill="none" stroke="#20242a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M613 518L625 501L608 503" fill="none" stroke="#20242a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Replace only the previous caption. -->
  <g filter="url(#cardShadow)">
    <rect x="229" y="748" width="1190" height="182" rx="18" fill="#fff" stroke="#dedbd5" stroke-width="2"/>
    <text x="824" y="815" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#15171b">
      <tspan>Position the </tspan><tspan fill="#1468e9" font-weight="700">Clock String Guide</tspan><tspan> over the spindle, then</tspan>
      <tspan x="824" dy="51" font-weight="700">press</tspan><tspan font-weight="400"> it straight onto the Clock Mechanism until fully seated.</tspan>
    </text>
  </g>
</svg>
